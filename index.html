<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desktop Test Studio</title>
    <meta name="description" content="A professional automation testing interface for desktop applications." />
    <meta property="og:title" content="Desktop Test Studio" />
    <meta property="og:description" content="A professional automation testing interface for desktop applications." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var fetchHandler = originalFetch ? originalFetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return fetchHandler;
            },
            set: function(val) {
              fetchHandler = val;
            }
          });
        } catch (e) {
          // Fallback if defineProperty fails
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
